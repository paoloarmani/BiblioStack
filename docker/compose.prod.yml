# Stack di PRODUZIONE di BiblioStack: PostgreSQL + Redis + backend (Node) + web (Caddy con la build del frontend).
#
#   cp docker/.env.prod.example docker/.env.prod     # e compilare TUTTI i valori
#   ./bibliostack.sh prod up                         # build delle immagini e avvio
#
# Dall'esterno è raggiungibile solo il servizio "web" (porte 80/443): database, Redis e backend
# restano sulla rete interna di Docker. Il frontend chiama l'API sullo stesso dominio (/api).

name: bibliostack

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:?Impostare POSTGRES_USER in docker/.env.prod}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Impostare POSTGRES_PASSWORD in docker/.env.prod}
  POSTGRES_DB: ${POSTGRES_DB:-bibliostack}
  # Ruolo con permessi minimi usato dal backend (creato da postgres/init/005_app_role.sh)
  APP_DB_USER: ${APP_DB_USER:-bibliostack_app}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Impostare APP_DB_PASSWORD in docker/.env.prod}

services:
  # ---------- DATABASE ----------
  db:
    build: ./postgres            # postgres:18.3 + locale it_IT.UTF-8
    restart: unless-stopped
    environment:
      <<: *db-env
    command: ["postgres", "-c", "timezone=Europe/Rome"]
    volumes:
      - pgdata:/var/lib/postgresql
      # Gli script di init girano solo alla prima creazione del volume
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------- REDIS ----------
  redis:
    image: redis:${REDIS_VERSION:-8.10.2-alpine}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Impostare REDIS_PASSWORD in docker/.env.prod}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------- BACKEND (Express, solo dipendenze di produzione) ----------
  backend:
    build:
      context: ../backend
      target: prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      # Indirizzo pubblico dell'app: usato per CORS e per i link nelle email (più indirizzi separati da virgola)
      FRONTEND_URL: ${PUBLIC_URL:?Impostare PUBLIC_URL in docker/.env.prod (es. https://biblioteca.scuola.it)}
      # Il backend NON usa il proprietario del database: solo SELECT/INSERT/UPDATE/DELETE
      DATABASE_URL: postgresql://${APP_DB_USER:-bibliostack_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-bibliostack}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Impostare JWT_SECRET in docker/.env.prod}
      JWT_REFRESH: ${JWT_REFRESH:?Impostare JWT_REFRESH in docker/.env.prod}
      CARD_SECRET: ${CARD_SECRET:?Impostare CARD_SECRET in docker/.env.prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 1 = solo Caddy davanti al backend; 2 se c'è anche un proxy esterno (es. quello della scuola)
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Obbligatorio (il backend non parte senza): domini le cui email possono creare un account con Google
      ALLOWED_GOOGLE_DOMAINS: ${ALLOWED_GOOGLE_DOMAINS:?Impostare ALLOWED_GOOGLE_DOMAINS in docker/.env.prod (es. scuola.edu.it)}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}

  # ---------- WEB (Caddy: frontend compilato + HTTPS + proxy /api) ----------
  web:
    build:
      context: ../frontend
      target: prod
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # Solo dietro un proxy esterno: da chi accettare X-Forwarded-For (es. private_ranges)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    volumes:
      # Certificati e chiavi di Caddy: da conservare, altrimenti Let's Encrypt li riemette a ogni ricreazione
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
